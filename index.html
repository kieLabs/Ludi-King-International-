<!-- GITHUB PAGES COMPATIBILITY FIX -->
<script>
(function () {
  if (window.__LKI_GITHUB_REPAIRED__) return;

  window.__LKI_GITHUB_REPAIRED__ = true;

  const pageURL = window.location.href.split("#")[0];

  fetch(pageURL, { cache: "no-store" })
    .then(function (response) {
      if (!response.ok) {
        throw new Error("Unable to load the current HTML file.");
      }

      return response.text();
    })
    .then(function (source) {
      let html = source;

      /* Remove Blogger-specific root attributes */
      html = html.replace(
        /<html\b[^>]*>/i,
        '<html lang="en">'
      );

      /* Remove Blogger-only skin element */
      html = html.replace(
        /<b:skin\b[^>]*>[\s\S]*?<\/b:skin>/gi,
        ""
      );

      /* Convert XML-style self-closing HTML elements */
      const nonVoidTags = [
        "div", "span", "section", "article", "aside",
        "header", "footer", "main", "nav", "a",
        "button", "label", "form", "ul", "ol", "li",
        "p", "h1", "h2", "h3", "h4", "h5", "h6",
        "b", "i", "strong", "em", "small", "code",
        "pre", "blockquote", "figure", "figcaption",
        "details", "summary", "fieldset", "legend",
        "textarea", "select", "option", "datalist",
        "output", "canvas", "video", "audio"
      ];

      const selfClosingPattern = new RegExp(
        "<(" + nonVoidTags.join("|") +
        ")(\\b[^<>]*?)\\s*/>",
        "gi"
      );

      html = html.replace(
        selfClosingPattern,
        "<$1$2></$1>"
      );

            /* Match the main button colours */
      const buttonStyles = `
        /* GitHub: matching colours for primary buttons */
        .btn-local,
        .btn-friends,
        .btn-share,
        .btn-match {
          background: linear-gradient(
            135deg,
            #11998e,
            #087f70
          ) !important;

          color: #ffffff !important;
        }

        /* Preserve the original Play vs Computer colour */
        .btn-online {
          background: linear-gradient(
            135deg,
            #ffea00,
            #ff9d00
          ) !important;

          color: #541500 !important;
        }
      `;

      html = html.replace(
        /<\/style>/i,
        buttonStyles + "\n</style>"
      );

      /* Render the corrected HTML */
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function (error) {
      console.error(
        "Ludo King GitHub compatibility error:",
        error
      );
    });
})();
</script>
